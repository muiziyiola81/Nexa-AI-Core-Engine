apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexa-core-engine
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/nexa-repo/nexa-core-engine:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: NODE_ENV
              value: "production"
            - name: STANDALONE_API
              value: "true"
            - name: ACTIVE_ADAPTER
              value: "nexa-native"
            - name: REQUIRE_API_KEY
              value: "true"
            - name: ALLOWED_ORIGINS
              value: "https://your-nexa-ai-app.example.com"
            - name: AUTO_LOAD_MODELS
              value: "nexa-p36-tier3"
            - name: AUTO_LOAD_ON_DEMAND
              value: "true"
            - name: RATE_LIMIT_PER_MINUTE
              value: "120"
            - name: MAX_CONCURRENT_REQUESTS
              value: "4"
            - name: DEFAULT_CPU_THREADS
              value: "2"
            # Mount NEXA_API_KEY from Google Cloud Secret Manager:
            - name: NEXA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexa-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Optional: Uncomment below if mounting a GCS bucket for large .gguf models
          # volumeMounts:
          #   - name: gcs-models
          #     mountPath: /app/models
      # volumes:
      #   - name: gcs-models
      #     csi:
      #       driver: gcsfuse.run.googleapis.com
      #       readOnly: true
      #       volumeAttributes:
      #         bucketName: YOUR_NEXA_MODELS_BUCKET
